        <style>

        body{ font-family: sans-serif;margin: 0;display: flex;flex-direction: column;min-height: 100vh;}
        header,footer{background-color: #333;color: white;text-align: center;padding: 1em;}
        nav{background: #eb72e3;padding: 10px;text-align: center;}
        main{display: flex;flex:1 ;}
        section{flex: 1;padding: 20px;border: 1px solid #ccc;}

        <title>Area do quadrado</title>
        <script>
            function qdd(){
                var vbqq = document.dados.vbqq.value;
                var vaqq = document.dados.vaqq.value;
                var larg = document.dados.larg.value;
                if((vbqq == 0)||(vaqq == 0)||(larg == 0)){
                    alert("Digite o valor da base e altura do quadrado");
                }else{
                    var areaqq=(vbqq*vaqq*larg);
                    alert("O VALOR DA ÁREA DO CUBO É "+areaqq+"M³");}}
                    </script>
    </head>
    <body>
        <form name="dados"></form>
         
            <label>Digite o valor da base do cubo:</label><br>
            <input type="text" name="vbqq" placeholder="EX: 5"><br><br>
            <label >Digite o valor da altura do cubo:</label><br>
            <input type="text" name="vaqq" placeholder="EX: 5"><br><br>
            <label>Digite a largura do cubo:</label><br><br>
            <input type="text" name="larg" placeholder="EX:5"><br><br>
            <input type="button" name="bcq" value="calcular" onclick="qdd()">
    </body>
